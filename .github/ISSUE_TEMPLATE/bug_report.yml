name: Bug report
description: Something in NightCoop Manager does not work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This is an unofficial tool.** Problems with the mod itself — crashes in game,
        server connection, gameplay, bans — belong to the NightCoop team: https://nightcoop.net/

        Please attach the log: open the app, reproduce the problem, press **Save log**
        and paste the file contents below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Select ...
        3. Press ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: dropdown
    id: game-version
    attributes:
      label: Game version
      options:
        - "2.5"
        - "2.31"
        - Not sure
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: NightCoop Manager version
      description: Shown in the window title and in the release name.
      placeholder: "0.2.1"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"

  - type: dropdown
    id: store
    attributes:
      label: Where is the game installed?
      options:
        - Steam
        - GOG
        - Epic Games
        - Other / not sure

  - type: textarea
    id: log
    attributes:
      label: Log
      description: Press "Save log" in the app and paste the contents here.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The game was closed during installation or update
          required: true
        - label: I am reporting a problem with this tool, not with the mod itself
          required: true

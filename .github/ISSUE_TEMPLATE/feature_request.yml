name: Feature request
description: Suggest an improvement or a new feature for NightCoop Manager
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is an unofficial installer/updater. Ideas about the mod itself
        should go to the NightCoop team: https://nightcoop.net/

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the tool is inconvenient or missing something.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the expected behaviour.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
